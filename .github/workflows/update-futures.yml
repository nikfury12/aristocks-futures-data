name: Update MOEX futures

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-moex-futures
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate contracts
        run: node scripts/update-futures.mjs
      - name: Save updated data
        run: |
          if [ -z "$(git status --porcelain -- data/futures.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures.json
          git commit -m "data: update MOEX futures [skip ci]"
          git push
